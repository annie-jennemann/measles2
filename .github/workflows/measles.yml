name: Update measles charts

on:
  push:
    branches:
      - main
  schedule:
    - cron:  "0 9-23 * * FRI"
    
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python scraper
        env:
          DW_API_KEY: ${{ secrets.DW_API_KEY }}
          CHART_KEY: ${{ secrets.CHART_KEY }}
          CHART_KEY1: ${{ secrets.CHART_KEY1 }}
          CHART_KEY2: ${{ secrets.CHART_KEY2 }}
        run: |
          python scripts/measles.py

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add last_weekly_us.csv last_map_us.csv last_annual_us.csv
          git diff --cached --quiet || git commit -m "Update measles data snapshots"
          git push




